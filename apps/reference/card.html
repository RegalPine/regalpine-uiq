<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UIQ Reference — Card Scenarios</title>
    <style>
      :root {
        --color-bg: #ffffff;
        --color-surface: #f8f9fa;
        --color-text: #333333;
        --color-text-secondary: #666666;
        --color-border: #e0e0e0;
        --color-primary: #1a73e8;
        --spacing-sm: 8px;
        --spacing-md: 16px;
        --spacing-lg: 24px;
        --radius: 8px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.12);
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--color-bg);
        color: var(--color-text);
        padding: var(--spacing-lg);
      }
      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: var(--spacing-lg);
        max-width: 400px;
        margin-bottom: var(--spacing-lg);
      }
      .card-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: var(--spacing-sm);
      }
      .card-body {
        font-size: 14px;
        color: var(--color-text-secondary);
        margin-bottom: var(--spacing-md);
      }
      .card-footer {
        display: flex;
        gap: var(--spacing-sm);
      }
      .card-btn {
        padding: var(--spacing-sm) var(--spacing-md);
        border: 1px solid var(--color-border);
        border-radius: var(--radius);
        background: white;
        cursor: pointer;
        font-size: 14px;
      }
      .card-btn-primary {
        background: var(--color-primary);
        color: white;
        border-color: var(--color-primary);
      }
    </style>
  </head>
  <body>
    <h1>Card Scenarios</h1>

    <div class="card" data-uiq-id="card-product">
      <div class="card-title" data-uiq-id="card-product-title">Product Card</div>
      <div class="card-body" data-uiq-id="card-product-body">
        A standard product card with title, description, and action buttons.
      </div>
      <div class="card-footer" data-uiq-id="card-product-footer">
        <button class="card-btn card-btn-primary" data-uiq-id="card-btn-buy">Buy Now</button>
        <button class="card-btn" data-uiq-id="card-btn-details">Details</button>
      </div>
    </div>

    <div class="card" data-uiq-id="card-info">
      <div class="card-title" data-uiq-id="card-info-title">Info Card</div>
      <div class="card-body" data-uiq-id="card-info-body">
        An informational card with minimal actions.
      </div>
    </div>
  </body>
</html>
